name: API Validation

on:
  pull_request:
    paths:
      - "Cloudflare/**"
      - "Server/**"
      - "Shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api-validation.yml"
      - ".github/workflows/cloudflare-deploy.yml"
  push:
    branches: [master, main]
    paths:
      - "Cloudflare/**"
      - "Server/**"
      - "Shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api-validation.yml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-validation-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  swift-packages:
    name: Shared and server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Cache SwiftPM builds
        uses: actions/cache@v5
        with:
          path: |
            Shared/.build
            Server/.build
          key: ${{ runner.os }}-swift-6.1-${{ hashFiles('Shared/Package.swift', 'Shared/Package.resolved', 'Server/Package.swift', 'Server/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.1-

      - name: Verify package layout
        shell: bash
        run: |
          set -euo pipefail
          test -f Shared/Package.swift || {
            echo "::error::Shared/Package.swift is missing. Land the Swift shared-model scaffold first."
            exit 1
          }
          test -f Server/Package.swift || {
            echo "::error::Server/Package.swift is missing. Land the Vapor server scaffold first."
            exit 1
          }

      - name: Test shared models
        run: swift test --package-path Shared

      - name: Test Vapor server
        run: swift test --package-path Server

  cloudflare:
    name: Cloudflare Worker and Linux image validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Worker dependencies
        working-directory: Cloudflare
        run: npm ci

      - name: Verify Worker bindings, types, tests, and configuration
        working-directory: Cloudflare
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          set -euo pipefail
          mkdir -p "$WRANGLER_LOG_PATH"
          npx wrangler types --include-runtime false --check
          npm run check

      - name: Validate Worker and container deployment
        working-directory: Cloudflare
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: npm run config:check

      - name: Build Linux amd64 Vapor container image
        run: docker build --platform linux/amd64 --tag dont-unplug-that-server:ci .

