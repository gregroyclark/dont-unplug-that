name: Website Build and Deploy

on:
  pull_request:
    paths:
      - "Website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [master, main]
    paths:
      - "Website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to build and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: Website
    steps:
      - name: Validate requested commit
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Website deployments require a full 40-character commit SHA."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - name: Validate Cloudflare website package
        run: npx wrangler deploy --dry-run

      - name: Preserve verified website assets
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
          path: Website/dist/client/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy website to Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: website-production
      url: https://dontunplugthat.com
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source-sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - run: npm ci

      - name: Restore verified website assets
        uses: actions/download-artifact@v4
        with:
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
          path: Website/dist/client/

      - name: Deploy website assets only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the website-production environment."
            exit 1
          fi
          npx wrangler whoami
          npx wrangler deploy

      - name: Verify public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 30 https://dontunplugthat.com/ -o "$RUNNER_TEMP/website.html"
          grep -Fq 'Don’t Unplug That — A clearer picture' "$RUNNER_TEMP/website.html"
          for asset in images/living-room-audio.webp images/welcome-setup.jpg; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --max-time 30 "https://dontunplugthat.com/$asset" -o /dev/null
          done
