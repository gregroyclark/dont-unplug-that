name: Native App Validation

on:
  pull_request:
    paths:
      - "App/**"
      - "Shared/**"
      - ".github/workflows/native-validation.yml"
      - ".github/workflows/ios-testflight.yml"
      - ".github/workflows/google-play-internal.yml"
  push:
    branches: [master, main]
    paths:
      - "App/**"
      - "Shared/**"
      - ".github/workflows/native-validation.yml"
      - ".github/workflows/ios-testflight.yml"
      - ".github/workflows/google-play-internal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  skip-app:
    name: Skip iOS and Android verification
    # Skip 1.9.5's Android Swift toolchain is not yet compatible with Xcode 27.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache app build dependencies
        uses: actions/cache@v5
        with:
          path: |
            App/.build
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-skip-${{ hashFiles('App/Package.swift', 'App/Package.resolved', 'App/Skip.env', 'App/**/skip.yml', 'App/Android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-skip-

      - name: Verify Skip app layout
        shell: bash
        run: |
          set -euo pipefail
          for path in App/Package.swift App/Skip.env App/Project.xcworkspace App/Darwin App/Android; do
            test -e "$path" || {
              echo "::error::$path is missing. Land the conventional Skip Fuse app scaffold first."
              exit 1
            }
          done

      - name: Install Skip Fuse toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install skiptools/skip/skip
          skip android sdk install
          skip version

      - name: Create ephemeral Android debug key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify project configuration
        working-directory: App
        run: skip verify --verbose --project .

      - name: Run Swift app tests
        working-directory: App
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d Tests ]]; then
            swift test
          else
            echo "No App/Tests directory yet; build verification remains required."
          fi

      - name: Build debug iOS and Android artifacts
        working-directory: App
        run: skip export --debug --dir "$RUNNER_TEMP/skip-export" --verbose

      - name: Upload downloadable Android APK
        if: github.event_name == 'push'
        id: android-apk
        uses: actions/upload-artifact@v4
        with:
          name: dont-unplug-that-android-debug-${{ github.sha }}
          path: ${{ runner.temp }}/skip-export/**/*.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Add APK download to run summary
        if: github.event_name == 'push'
        shell: bash
        env:
          APK_ARTIFACT_URL: ${{ steps.android-apk.outputs.artifact-url }}
        run: |
          {
            echo "## Android APK"
            echo
            echo "[Download the debug APK for commit \`${GITHUB_SHA}\`](${APK_ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize artifacts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Skip build artifacts"
            echo
            find "$RUNNER_TEMP/skip-export" -type f \
              \( -name '*.ipa' -o -name '*.apk' -o -name '*.aab' \) \
              -exec sh -c 'for file do printf -- "- `%s` (%s bytes)\n" "$(basename "$file")" "$(stat -f %z "$file")"; done' sh {} +
          } >> "$GITHUB_STEP_SUMMARY"

  ios-foundation-models:
    name: Foundation Models iOS compile (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log Xcode version
        run: xcodebuild -version

      - name: Compile iOS app without Android or signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App/Project.xcworkspace \
            -scheme 'DontUnplugThat App' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Xcode27" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SKIP_ACTION=none \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
